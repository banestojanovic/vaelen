name: Build Vaelen PHP

# Keep every release run queued rather than replacing an older pending run.
# Catalog promotion reads and merges the current feed only while owning this
# repository-wide release lane.
concurrency:
  group: vaelen-php-release-catalog
  queue: max

on:
  workflow_dispatch:
    inputs:
      php_build_config:
        description: "Vaelen PHP build configuration"
        required: true
        default: "Distribution/PHP/php-8.4.26.json"
  push:
    tags:
      - 'php-v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Vaelen PHP arm64
    runs-on: macos-14
    timeout-minutes: 240
    steps:
      - name: Checkout Vaelen
        uses: actions/checkout@v4

      - name: Read build configuration
        id: config
        run: |
          config="${{ inputs.php_build_config }}"
          if [ -z "$config" ]; then
            config="Distribution/PHP/php-${GITHUB_REF_NAME#php-v}.json"
          fi
          test -f "$config"
          echo "path=$config" >> "$GITHUB_OUTPUT"
          version=$(jq -r '.phpVersion' "$config")
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "php-v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match configured PHP $version" >&2; exit 1
          fi
          echo "php-version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up build PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: curl,mbstring,openssl
          ini-values: memory_limit=-1
          coverage: none

      - name: Build, validate, package, and manifest PHP
        run: |
          # Manual dispatches may originate from any branch. The artifact URLs
          # always point at the immutable, version-derived package release tag.
          release_tag="php-v${{ steps.config.outputs.php-version }}"
          release_base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${release_tag}"
          PHP_BUILD_CONFIG="${{ steps.config.outputs.path }}"
          VAELEN_BUILD_ROOT="$GITHUB_WORKSPACE/.build/php" \
          VAELEN_RELEASE_TAG="$release_tag" \
          VAELEN_RELEASE_BASE_URL="$release_base_url" \
          VAELEN_PHP_CATALOG_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/php-catalog/php-catalog.json" \
          VAELEN_MANIFEST_TRUST="${{ startsWith(github.ref, 'refs/tags/') && 'trusted-vaelen-release-manifest' || 'unreleased-workflow-build' }}" \
            Scripts/build-php.sh "$PHP_BUILD_CONFIG"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vaelen-php-${{ steps.config.outputs.php-version }}-arm64
          path: .build/php/release/*

      - name: Publish trusted Vaelen release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing versioned PHP release $GITHUB_REF_NAME" >&2; exit 1
          fi
          manifest=.build/php/release/vaelen-php-manifest.json
          cli=$(jq -r '.artifacts.cli.file' "$manifest")
          fpm=$(jq -r '.artifacts.fpm.file' "$manifest")
          gh release create "$GITHUB_REF_NAME" \
            --title "Vaelen PHP ${{ steps.config.outputs.php-version }}" \
            --notes "Vaelen-controlled PHP arm64 distribution built from pinned static-php-cli sources. SHA-256 values are integrity checks against the attached Vaelen manifest; authenticity derives from the trusted Vaelen release and workflow." \
            ".build/php/release/$cli" ".build/php/release/$fpm" "$manifest"
          Scripts/promote-php-catalog.sh "$GITHUB_REF_NAME" "$manifest"
